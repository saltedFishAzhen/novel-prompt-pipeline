name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.lock.txt
      - run: python -m pip install -e . --no-deps --no-build-isolation
      - run: python -m ruff check src prompts/runtime tests scripts
      - run: python -m ruff format --check src prompts/runtime tests scripts
      - run: novel-pipeline prompts check
      - run: python -m pip check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.lock.txt
      - run: python -m pip install -e . --no-deps --no-build-isolation
      - run: python -m pytest --cov --cov-report=term-missing:skip-covered

  distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.lock.txt
      - run: python -m pip install . --no-deps --no-build-isolation
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/wheel_smoke.py --wheel-dir dist
