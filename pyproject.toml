[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "novel-prompt-pipeline"
version = "0.3.0"
description = "ComfyUI client that runs novel-storyboard H3 production packages"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Novel Prompt Pipeline contributors"}]
keywords = ["comfyui", "video", "storyboard"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "httpx>=0.28,<1",
]

[project.urls]
Homepage = "https://github.com/saltedFishAzhen/novel-prompt-pipeline"
Repository = "https://github.com/saltedFishAzhen/novel-prompt-pipeline"
Issues = "https://github.com/saltedFishAzhen/novel-prompt-pipeline/issues"

[project.optional-dependencies]
images = ["openai>=2.54,<3"]
dev = [
  "build>=1.2,<2",
  "hatchling>=1.27,<2",
  "editables>=0.5,<1",
  "ruff>=0.12,<1",
  "twine>=6,<7",
]

[project.scripts]
comfyui-remote = "comfyui_client.__main__:main"
openai-images = "openai_images.__main__:main"

[tool.hatch.build]
exclude = ["**/__pycache__", "**/*.pyc", "/runs"]

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["workflows/comfyui_client", "workflows/openai_images"]

# The declaration and the workflow stay outside the package in the source tree,
# so they are installed next to it and resolved relative to the package's parent.
[tool.hatch.build.targets.wheel.force-include]
"workflows/workflow_bindings.json" = "workflow_bindings.json"
"workflows/h3-ref2va-api.json" = "h3-ref2va-api.json"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = ["/workflows", "/LICENSE", "/pyproject.toml"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["workflows"]
extend-exclude = [".tmp", ".venv", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
